name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run integration tests
        run: python -m unittest discover -s tests -v
      - name: Install package
        run: python -m pip install .
      - name: Check installed command and packaged template
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          git-trail --version
          git-trail "${{ github.workspace }}" -o git-trail-smoke.html
          python -c "from pathlib import Path; text = Path('git-trail-smoke.html').read_text(encoding='utf-8'); assert 'trail-data' in text; assert '__GIT_TRAIL_DATA__' not in text"

  browser:
    name: Offline browser interaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise the offline page
        run: node tests/browser-smoke.cjs examples/demo.html
